<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 570" width="920" height="570" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="t">Topologia do lab / Lab topology</title>
  <desc id="d">Internet, roteador de casa, OPNsense com WAN, gerência Host-Only e tronco lab-lan com as VLANs 10, 20 e 30. A VLAN 20 é bloqueada para a VLAN 30.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#cf222e"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="919" height="569" rx="12" fill="#ffffff" stroke="#d0d7de"/>

  <!-- Internet e roteador -->
  <rect x="380" y="18" width="160" height="36" rx="18" fill="#f6f8fa" stroke="#57606a"/>
  <text x="460" y="41" text-anchor="middle" font-size="14" font-weight="600" fill="#24292f">Internet</text>
  <line x1="460" y1="54" x2="460" y2="86" stroke="#57606a" stroke-width="2"/>

  <rect x="340" y="86" width="240" height="46" rx="8" fill="#f6f8fa" stroke="#57606a"/>
  <text x="460" y="106" text-anchor="middle" font-size="13" font-weight="600" fill="#24292f">Home router</text>
  <text x="460" y="123" text-anchor="middle" font-size="12" fill="#57606a">192.168.0.1</text>

  <line x1="460" y1="132" x2="460" y2="174" stroke="#57606a" stroke-width="2"/>
  <text x="472" y="157" font-size="11" fill="#57606a">WAN · Bridge · DHCP (em1)</text>

  <!-- OPNsense -->
  <rect x="260" y="174" width="400" height="104" rx="10" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="460" y="198" text-anchor="middle" font-size="15" font-weight="700" fill="#0550ae">OPNsense (VM)</text>
  <text x="460" y="220" text-anchor="middle" font-size="12" fill="#24292f">WAN em1 · DHCP 192.168.0.x</text>
  <text x="460" y="240" text-anchor="middle" font-size="12" fill="#24292f">MGMT em0 · 192.168.56.2/24 (Host-Only)</text>
  <text x="460" y="260" text-anchor="middle" font-size="12" fill="#24292f">LabTrunk em2 · no IP (Internal Network lab-lan)</text>

  <!-- PC / gerência -->
  <rect x="24" y="186" width="190" height="80" rx="8" fill="#f6f8fa" stroke="#57606a"/>
  <text x="119" y="212" text-anchor="middle" font-size="13" font-weight="600" fill="#24292f">Host PC</text>
  <text x="119" y="232" text-anchor="middle" font-size="12" fill="#57606a">vboxnet0 · 192.168.56.1</text>
  <text x="119" y="250" text-anchor="middle" font-size="11" fill="#57606a">VirtualBox host</text>
  <line x1="214" y1="226" x2="260" y2="226" stroke="#0969da" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="237" y="217" text-anchor="middle" font-size="10" fill="#0550ae">Host-Only</text>

  <!-- Tronco -->
  <line x1="460" y1="278" x2="460" y2="318" stroke="#8250df" stroke-width="3"/>
  <text x="472" y="303" font-size="11" fill="#6639ba">lab-lan · 802.1Q trunk</text>
  <rect x="70" y="318" width="780" height="10" rx="5" fill="#8250df"/>
  <line x1="190" y1="328" x2="190" y2="368" stroke="#8250df" stroke-width="3"/>
  <line x1="460" y1="328" x2="460" y2="368" stroke="#8250df" stroke-width="3"/>
  <line x1="730" y1="328" x2="730" y2="368" stroke="#8250df" stroke-width="3"/>

  <!-- VLAN 10 -->
  <rect x="70" y="368" width="240" height="124" rx="10" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="190" y="392" text-anchor="middle" font-size="14" font-weight="700" fill="#1a7f37">VLAN 10 · ADMIN</text>
  <text x="190" y="414" text-anchor="middle" font-size="12" fill="#24292f">192.168.10.0/24 · GW .1</text>
  <text x="190" y="434" text-anchor="middle" font-size="12" fill="#24292f">DHCP .100–.200</text>
  <text x="190" y="454" text-anchor="middle" font-size="12" fill="#24292f">Rule: Pass → any</text>

  <!-- VLAN 20 -->
  <rect x="340" y="368" width="240" height="124" rx="10" fill="#fff8c5" stroke="#9a6700" stroke-width="1.5"/>
  <text x="460" y="392" text-anchor="middle" font-size="14" font-weight="700" fill="#7d4e00">VLAN 20 · USUARIOS</text>
  <text x="460" y="414" text-anchor="middle" font-size="12" fill="#24292f">192.168.20.0/24 · GW .1</text>
  <text x="460" y="434" text-anchor="middle" font-size="12" fill="#24292f">Kali (eth0.20) · .108 via DHCP</text>
  <text x="460" y="454" text-anchor="middle" font-size="12" fill="#24292f">Rule: Block → VLAN 30, Pass → rest</text>

  <!-- VLAN 30 -->
  <rect x="610" y="368" width="240" height="124" rx="10" fill="#f6f8fa" stroke="#57606a" stroke-width="1.5"/>
  <text x="730" y="392" text-anchor="middle" font-size="14" font-weight="700" fill="#24292f">VLAN 30 · SERVIDORES</text>
  <text x="730" y="414" text-anchor="middle" font-size="12" fill="#24292f">192.168.30.0/24 · GW .1</text>
  <text x="730" y="434" text-anchor="middle" font-size="12" fill="#24292f">Zabbix · 192.168.30.10 (static)</text>
  <text x="730" y="454" text-anchor="middle" font-size="12" fill="#24292f">Panel: 192.168.56.10 (Host-Only)</text>
  <text x="730" y="474" text-anchor="middle" font-size="12" fill="#24292f">Agent → OPNsense 192.168.30.1:10050</text>

  <!-- Bloqueio VLAN 20 -> VLAN 30 -->
  <path d="M 460 492 Q 595 538 730 492" fill="none" stroke="#cf222e" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arr)"/>
  <text x="595" y="527" text-anchor="middle" font-size="12" font-weight="600" fill="#cf222e">✗ VLAN 20 → VLAN 30 blocked</text>

  <text x="460" y="558" text-anchor="middle" font-size="11" fill="#57606a">VirtualBox lab · Zabbix queries the OPNsense agent from VLAN 30 (port 10050)</text>
</svg>
